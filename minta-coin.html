<!DOCTYPE html>
<html lang="id">
<head><!-- PLAYABLE_TOUCH_PATCH_V1 --><script>

  var origAdd = EventTarget.prototype.addEventListener;
  var blockedTypes = { touchstart: 1, touchmove: 1, wheel: 1 };
  EventTarget.prototype.addEventListener = function(type, listener, options) {
    if (blockedTypes[type]) {
      if (options === undefined || options === null) {
        options = { passive: true };
      } else if (typeof options === 'boolean') {
        options = { capture: options, passive: true };
      } else {

</script><script>window.Intl=window.Intl||{};Intl.t=function(s){return(Intl._locale&&Intl._locale[s])||s;};</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RUANG SADAR - Minta Coin Edukasi</title>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f0f7ff;min-height:100vh}
header{background:#fff;border-bottom:2px solid #bfdbfe;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.btn{width:100%;height:56px;border:none;border-radius:14px;font-weight:900;font-size:14px;cursor:pointer;margin-top:12px}
.card{margin:12px;padding:16px;background:#fff;border:2px solid #bfdbfe;border-radius:16px}
@keyframes popIn{0%{transform:scale(0.8);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<header>
<div style="display:flex;align-items:center;gap:8px">
<button onclick="location.href='portal.html'" style="width:36px;height:36px;border:none;border-radius:10px;background:#dbeafe;color:#0d47a1;font-weight:900">←</button>
<div><div style="font-weight:900;color:#0d47a1;font-size:13px">RUANG SADAR</div><div style="font-size:9px;color:#64748b">MINTA COIN EDUKASI</div></div>
</div>
<div id="topCoin" style="background:#dcfce7;color:#15803d;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:800">0 Coin</div>
</header>

<div class="card" style="text-align:center">
<div style="font-size:11px;color:#64748b">Saldo Coin Edukasi Kamu</div>
<div id="walletCoin" style="font-size:36px;font-weight:900;color:#0d47a1;margin:6px 0">0</div>
<div id="myEmail" style="font-size:10px;color:#94a3b8"></div>
</div>

<div class="card">
<div style="text-align:center;font-weight:900;color:#15803d;font-size:15px">🎁 MINTA 50.000 GRATIS - AUTO MASUK</div>
<button class="btn" style="background:linear-gradient(90deg,#22c55e,#15803d);color:#fff" onclick="mintaAuto()">🎁 MINTA 50.000 COIN GRATIS</button>
<div id="msg" style="text-align:center;margin-top:14px;font-size:12px;font-weight:800;min-height:20px;color:#0d47a1"></div>
</div>

<!-- POPUP BATAS COIN -->
<div id="limitPopup" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;align-items:center;justify-content:center;padding:20px">
  <div style="background:#fff;border:2px solid #bfdbfe;border-radius:20px;padding:22px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.2);animation:popIn 0.25s ease">
    <div style="width:64px;height:64px;background:#fef3c7;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:32px">⚠️</div>
    <div style="font-weight:900;color:#0d47a1;font-size:16px">COIN MASIH ADA!</div>
    <div style="font-size:12px;color:#64748b;margin:8px 0 4px;line-height:1.5">Habiskan dulu coin yang ada baru minta lagi ya.</div>
    <div style="background:#f0f7ff;border:1px dashed #93c5fd;border-radius:12px;padding:10px;margin:12px 0">
      <div style="font-size:11px;color:#64748b">Saldo kamu sekarang</div>
      <div id="popupCoin" style="font-weight:900;color:#0d47a1;font-size:18px">0 Coin</div>
    </div>
    <div style="font-size:11px;color:#94a3b8;margin-bottom:14px">Mainkan dulu sampai di bawah 5.000 coin baru bisa minta lagi.</div>
    <button onclick="closeLimitPopup()" style="width:100%;height:48px;border:none;border-radius:12px;background:linear-gradient(90deg,#0d47a1,#1a73e8);color:#fff;font-weight:900;font-size:13px;cursor:pointer">OKE, HABISKAN DULU</button>
  </div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyBeTALsF43ij3aAlZjF1XeBjB1gNtaTb2I",authDomain:"game-demo-4db7f.firebaseapp.com",projectId:"game-demo-4db7f",storageBucket:"game-demo-4db7f.firebasestorage.app",messagingSenderId:"405381506143",appId:"1:405381506143:web:da63f34a24f01e4f0367ea"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();const db=firebase.firestore();
let curUser=null;
let curCoinGlobal = 0;
const BATAS_COIN = 5000; // kalau saldo >= ini, muncul popup habiskan dulu

function showLimitPopup(coin){
  document.getElementById("popupCoin").textContent = Number(coin).toLocaleString() + " Coin";
  document.getElementById("limitPopup").style.display="flex";
}
function closeLimitPopup(){
  document.getElementById("limitPopup").style.display="none";
}
document.getElementById("limitPopup").addEventListener("click", function(e){
  if(e.target.id === "limitPopup") closeLimitPopup();
});

auth.onAuthStateChanged(u=>{
  if(!u){location.href="index.html";return;}
  curUser=u;
  document.getElementById("myEmail").textContent=u.email;
  db.collection("players").doc(u.uid).onSnapshot(doc=>{
    let coin=doc.exists?doc.data().wallet?.coin||0:0;
    curCoinGlobal=coin;
    document.getElementById("topCoin").textContent=Number(coin).toLocaleString()+" Coin";
    document.getElementById("walletCoin").textContent=Number(coin).toLocaleString();
  });
});

async function mintaAuto(){
 const msg=document.getElementById("msg");
 try{
  let ref=db.collection("players").doc(curUser.uid);
  let doc=await ref.get();
  let now=doc.exists?doc.data().wallet?.coin||0:0;
  curCoinGlobal = now;
  if(now >= BATAS_COIN){
    showLimitPopup(now);
    msg.style.color="#dc2626";
    msg.textContent="⚠️ Saldo masih "+Number(now).toLocaleString()+" - habiskan dulu!";
    return;
  }
  msg.textContent="⏳ Menambahkan 50.000...";
  await ref.set({profile:{email:curUser.email},wallet:{coin:now+50000}},{merge:true});
  msg.style.color="#15803d";msg.textContent="✅ +50.000 Masuk!";
 }catch(e){msg.style.color="#dc2626";msg.textContent="❌ "+e.message}
}
</script>
</body>
</html>
